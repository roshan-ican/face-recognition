<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Camera Test</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      #status { padding: .6rem .8rem; border-radius: 6px; background: #eee; }
      #status.ok { background: #d7f5dd; }
      #status.err { background: #fadbdb; }
      video { background: #000; max-width: 100%; margin-top: 1rem; }
    </style>
  </head>

  <body>
    <h1>Camera Test</h1>

    <p id="status">Ready.</p>
    <button id="startCamera">Start Camera</button>

    <video id="camera" width="640" height="480" autoplay playsinline muted></video>

    <script>
      const button = document.getElementById("startCamera");
      const video = document.getElementById("camera");
      const status = document.getElementById("status");

      function say(message, kind) {
        status.textContent = message;
        status.className = kind || "";
        console.log(message);
      }

      // window.isSecureContext is the browser telling us directly whether
      // getUserMedia is allowed here. Check it up front so a failure is
      // obvious instead of showing up as a confusing exception later.
      if (!window.isSecureContext) {
        say("Not a secure context (" + location.origin + "). Camera is blocked. Use https://", "err");
      } else if (!navigator.mediaDevices) {
        say("navigator.mediaDevices is missing — browser too old?", "err");
      } else {
        say("Secure context OK. Click Start Camera.", "ok");
      }

      button.addEventListener("click", async () => {
        say("Requesting camera permission...");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;

          // A MediaStream carries tracks. Reading the video track's settings
          // tells us the real resolution and frame rate we ended up with,
          // which matters once we start shipping frames to Go.
          const track = stream.getVideoTracks()[0];
          const s = track.getSettings();
          say("Camera live: " + track.label + " — " + s.width + "x" + s.height + " @ " + s.frameRate + "fps", "ok");
        } catch (error) {
          // The error NAME is the useful part:
          //   NotAllowedError  - you (or a policy) denied permission
          //   NotFoundError    - no camera on this device
          //   NotReadableError - camera busy in another app
          say(error.name + ": " + error.message, "err");
        }
      });
    </script>
  </body>
</html>
